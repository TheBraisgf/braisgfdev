<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Multiverse – Braisgf.dev</title>
    <meta
      name="description"
      content="Explore Braisgf's social presence across the galaxy: YouTube, TikTok, GitHub, Twitch and more."
    />
    <meta
      name="keywords"
      content="Braisgf Social, YouTube, TikTok, GitHub, Twitch, LinkedIn, Developer Socials"
    />
    <meta name="author" content="Braisgf" />
    <link rel="canonical" href="https://braisgf.dev/social" />
    <link rel="icon" href="/assets/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-social" data-page="social">
    <canvas id="stars" aria-hidden="true"></canvas>

    <a href="/" class="back-btn" data-i18n="social.back">Back to Landing</a>

    <div class="lang-switch-container">
      <span class="flag">EN</span>
      <label class="lang-toggle" aria-label="Toggle language">
        <input type="checkbox" id="lang-toggle" />
        <span class="slider"></span>
      </label>
      <span class="flag">ES</span>
    </div>

    <div class="spaceship" aria-hidden="true">🚀</div>
    <p class="intro-text" data-i18n="social.intro">
      Click a planet to explore its secrets...
    </p>

    <main class="universe">
      <div class="planets" aria-label="Social network planets"></div>
    </main>

    <footer class="footer">
      <p>&copy; <span data-i18n="footer.copyright">2025 Braisgf.dev</span></p>
      <a href="https://github.com/thebraisgf" class="social" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/braisgf" class="social" target="_blank" rel="noopener">LinkedIn</a>
    </footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/social.js"></script>
  </body>
</html>
