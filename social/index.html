<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Multiverse – Braisgf.dev</title>
    <meta
      name="description"
      content="Explore Braisgf's social presence across the galaxy: YouTube, TikTok, GitHub, Twitch and more."
    />
    <meta
      name="keywords"
      content="braisgf, social, tiktok, youtube, github, twitch, linkedin, social links, social multiverse"
    />
    <meta name="author" content="Braisgf" />
    <link rel="canonical" href="https://braisgf.dev/social" />
    <link rel="alternate" hreflang="es" href="https://braisgf.dev/es/social" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="Social Multiverse – Braisgf.dev" />
    <meta
      property="og:description"
      content="🛸 Explore my social planets and connect with me in different galaxies."
    />
    <meta
      property="og:image"
      content="https://braisgf.dev/assets/braisgf-socials.png"
    />
    <meta property="og:url" content="https://braisgf.dev/social" />
    <meta property="og:type" content="profile" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Social Multiverse – Braisgf.dev" />
    <meta
      name="twitter:description"
      content="A galactic experience across all my social networks. Enter the orbit 🪐"
    />
    <meta
      name="twitter:image"
      content="https://braisgf.dev/assets/braisgf-socials.png"
    />

    <!-- Schema.org -->
    <script
      type="application/ld+json"
      src="/social/schema-social.json"
    ></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/social/social.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CVE80CP3QT"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CVE80CP3QT");
    </script>
  </head>
  <body>
    <div class="lang-switch-container">
      <span class="flag">EN</span>
      <label class="lang-toggle">
        <input type="checkbox" id="lang-toggle" />
        <span class="slider"></span>
      </label>
      <span class="flag">ES</span>
    </div>
    <button
      class="back-btn"
      onclick="window.location.href='/'"
      aria-label="Back to landing"
    >
      ← Back to Landing
    </button>

    <div class="universe">
      <canvas id="stars" aria-hidden="true"></canvas>
      <div class="spaceship" role="img" aria-label="Spaceship emoji">🛸</div>
      <div class="intro-text">Click a planet to explore its secrets...</div>
      <div
        class="planets"
        id="planet-container"
        aria-label="Social Planets"
      ></div>
    </div>

    <footer class="footer">
      <p>&copy; 2025 Braisgf.dev</p>
      <a href="https://github.com/braisgf" class="social">GitHub</a>
      <a href="https://linkedin.com/in/braisgf" class="social">LinkedIn</a>

    <script src="/social/social.js"></script>
