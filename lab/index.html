<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creators Lab – Braisgf.dev</title>
    <meta
      name="description"
      content="A retro-inspired interactive lab of creative experiments, games and tools made by Braisgf."
    />
    <meta
      name="keywords"
      content="Braisgf Lab, Creative Lab, Web Projects, Indie Games, Tech Experiments"
    />
    <meta name="author" content="Braisgf" />
    <link rel="canonical" href="https://braisgf.dev/lab" />
    <link rel="icon" href="/assets/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-lab" data-page="lab">
    <div class="lang-switch-container">
      <span class="flag">EN</span>
      <label class="lang-toggle" aria-label="Toggle language">
        <input type="checkbox" id="lang-toggle" />
        <span class="slider"></span>
      </label>
      <span class="flag">ES</span>
    </div>

    <header class="lab-header">
      <h1>
        > <span data-i18n="lab.boot_title">Initializing Creators Lab</span
        ><span class="blinking-cursor">_</span>
      </h1>
      <p class="boot-log" aria-live="polite"></p>
    </header>

    <main class="lab-grid" aria-label="Project cards"></main>

    <div id="labModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content"></div>
    </div>

    <a href="/" class="btn" data-i18n="nav.back">&larr; Back to Home</a>

    <footer class="footer">
      <p>&copy; <span data-i18n="footer.copyright">2025 Braisgf.dev</span></p>
      <a href="https://github.com/thebraisgf" class="social" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/braisgf" class="social" target="_blank" rel="noopener">LinkedIn</a>
    </footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/lab.js"></script>
  </body>
</html>
