<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Blog – Braisgf.dev</title>
    <meta
      name="description"
      content="Discover tech blog posts by Braisgf – Fullstack Developer, Maker & Creator."
    />
    <meta
      name="keywords"
      content="Braisgf Blog, Tech Blog, Fullstack Developer, Raspberry Pi, DIY Projects"
    />
    <meta name="author" content="Braisgf" />
    <link rel="canonical" href="https://braisgf.dev/blog" />
    <link rel="icon" href="/assets/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body class="page-blog" data-page="blog">
    <div class="lang-switch-container">
      <span class="flag">EN</span>
      <label class="lang-toggle" aria-label="Toggle language">
        <input type="checkbox" id="lang-toggle" />
        <span class="slider"></span>
      </label>
      <span class="flag">ES</span>
    </div>

    <main class="blog-wrapper">
      <h1 class="blog-title" data-i18n="blog.title">Creator Blog</h1>
      <div id="blog-posts" class="blog-posts" aria-live="polite"></div>

      <a href="/" class="btn-back" data-i18n="nav.back">&larr; Back to Home</a>
    </main>

    <div id="blogModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button class="close-btn" aria-label="Close">&times;</button>
        <img id="modal-image" class="modal-image" alt="" />
        <h2 id="modal-title"></h2>
        <div id="modal-content"></div>
        <video id="modal-video" class="modal-video" controls></video>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; <span data-i18n="footer.copyright">2025 Braisgf.dev</span></p>
      <a href="https://github.com/thebraisgf" class="social" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/braisgf" class="social" target="_blank" rel="noopener">LinkedIn</a>
    </footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/blog.js"></script>
  </body>
</html>
