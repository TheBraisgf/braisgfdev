<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Braisgf.dev – Fullstack Developer & Maker</title>
    <meta
      name="description"
      content="Welcome to Braisgf.dev – A geeky digital lab, fullstack dev portfolio, and experimental playground built and hosted on Raspberry Pi."
    />
    <meta
      name="keywords"
      content="Braisgf, Fullstack Developer, Web Developer, Maker, Raspberry Pi, Portfolio, Creative Lab"
    />
    <meta name="author" content="Braisgf" />
    <link rel="canonical" href="https://braisgf.dev/" />
    <link rel="alternate" hreflang="en" href="https://braisgf.dev/" />
    <link rel="alternate" hreflang="es" href="https://braisgf.dev/" />
    <link rel="icon" href="/assets/favicon.ico" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"

      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"

    <link rel="stylesheet" href="/css/main.css" />
    <script type="application/ld+json" src="/schema.json"></script>

  <body class="page-home" data-page="home">
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div class="lang-switch-container">
      <span class="flag">EN</span>
      <label class="lang-toggle" aria-label="Toggle language">
        <input type="checkbox" id="lang-toggle" />
        <span class="slider"></span>
      </label>
      <span class="flag">ES</span>
    </div>

    <main class="container">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-container">
          <img
            src="/assets/Braisgf.jpeg"
            alt="Braisgf profile photo"
            class="profile-img"
          />
          <div class="hero-texts">
            <h1 id="hero-title">Braisgf.dev</h1>
            <p class="position" data-i18n="home.position">
              Full Stack Developer & Creator
            </p>
            <p class="motto" data-i18n="home.motto">
              "Imagine, Code, Create, Share, Repeat"
            </p>
          </div>
        </div>
        <nav class="buttons" aria-label="Site navigation">
          <a href="/about/" class="btn" data-i18n="nav.about">About Me</a>
          <a href="/career/" class="btn" data-i18n="nav.career">My Career</a>
          <a href="/stack/" class="btn" data-i18n="nav.stack">Skill Cloud</a>
          <a href="/lab/" class="btn" data-i18n="nav.lab">Creators Lab</a>
          <a href="/blog/" class="btn" data-i18n="nav.blog">Creator Blog</a>
          <a href="/social/" class="btn" data-i18n="nav.social">Social Media</a>
        </nav>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; <span data-i18n="footer.copyright">2025 Braisgf.dev</span></p>
      <a href="https://github.com/thebraisgf" class="social" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/braisgf" class="social" target="_blank" rel="noopener">LinkedIn</a>
    </footer>

    <div class="cookie-banner" id="cookie-banner">
      <span data-i18n="cookie.message">This site uses cookies to save your preferences.</span>
      <button id="cookie-accept" data-i18n="cookie.accept">Accept</button>
    </div>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/home.js"></script>
  </body>
</html>
