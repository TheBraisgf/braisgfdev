<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack & Skills – Braisgf.dev</title>
    <meta
      name="description"
      content="A full-stack cloud of skills by Braisgf: from HTML to AI, Unity to AWS."
    />
    <meta
      name="keywords"
      content="Tech Stack, Skills, Braisgf, React, Node, Python, AWS, Unity, DevOps, Maker"
    />
    <meta name="author" content="Braisgf" />
    <link rel="canonical" href="https://braisgf.dev/stack" />
    <link rel="icon" href="/assets/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-stack" data-page="stack">
    <div class="lang-switch-container">
      <span class="flag">EN</span>
      <label class="lang-toggle" aria-label="Toggle language">
        <input type="checkbox" id="lang-toggle" />
        <span class="slider"></span>
      </label>
      <span class="flag">ES</span>
    </div>

    <main class="stack-wrapper">
      <h1 class="stack-title" data-i18n="stack.title">Skill Cloud</h1>

      <div class="filters" role="group" aria-label="Filter skills">
        <button class="filter-btn active" data-filter="all" data-i18n="stack.all">All</button>
        <button class="filter-btn" data-filter="core" data-i18n="stack.core">Core</button>
        <button class="filter-btn" data-filter="frontend" data-i18n="stack.frontend">Frontend</button>
        <button class="filter-btn" data-filter="backend" data-i18n="stack.backend">Backend</button>
        <button class="filter-btn" data-filter="devops" data-i18n="stack.devops">DevOps</button>
        <button class="filter-btn" data-filter="tools" data-i18n="stack.tools">Tools</button>
        <button class="filter-btn" data-filter="creative" data-i18n="stack.creative">Creative</button>
        <button class="filter-btn" data-filter="maker" data-i18n="stack.maker">Maker</button>
        <button class="reroll-btn" data-i18n="stack.reroll">Reroll</button>
      </div>

      <div class="cloud" aria-live="polite"></div>
    </main>

    <a href="/" class="btn-back" data-i18n="nav.back">&larr; Back to Home</a>

    <footer class="footer">
      <p>&copy; <span data-i18n="footer.copyright">2025 Braisgf.dev</span></p>
      <a href="https://github.com/thebraisgf" class="social" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/braisgf" class="social" target="_blank" rel="noopener">LinkedIn</a>
    </footer>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/stack.js"></script>
  </body>
</html>
